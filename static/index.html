<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA-SUB2_CONV</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700&display=swap');

  :root {
    --bg: #0d0f12;
    --surface: #131720;
    --border: #1e2535;
    --border-hi: #2a3550;
    --text: #c9d1e0;
    --muted: #72809a;
    --accent: #3b82f6;
    --green: #10b981;
    --red: #ef4444;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }

  .logo span { color: var(--accent); }

  .badge {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--border-hi);
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  main {
    flex: 1;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .controls,
  .upload-bar,
  .naming-bar,
  .naming-options {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .seg-group {
    display: flex;
    border: 1px solid var(--border-hi);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .seg-group button {
    padding: 6px 16px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: background 0.15s, color 0.15s;
  }

  .seg-group button + button { border-left: 1px solid var(--border-hi); }
  .seg-group button:hover { background: var(--border); color: var(--text); }
  .seg-group button.active { background: var(--accent); color: #fff; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 18px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: filter 0.15s, opacity 0.15s;
  }

  .btn:hover { filter: brightness(1.15); }
  .btn:active { filter: brightness(0.92); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-hi);
    color: var(--muted);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  .file-chip,
  .naming-card {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border: 1px solid var(--border-hi);
    border-radius: var(--radius);
    color: var(--text);
    min-height: 34px;
  }

  .file-chip {
    background: rgba(59, 130, 246, 0.08);
  }

  .file-chip.empty {
    color: var(--muted);
    background: transparent;
  }

  .naming-card {
    background: rgba(255, 255, 255, 0.02);
  }

  .naming-card label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .naming-card input[type="radio"] {
    accent-color: var(--accent);
  }

  .naming-input {
    min-width: 220px;
    padding: 7px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border-hi);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }

  .naming-input:focus {
    border-color: var(--accent);
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
  }

  .panels {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    min-height: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }

  .panel-header {
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-blue { background: var(--accent); }
  .dot-green { background: var(--green); }

  .panel-actions {
    display: flex;
    gap: 6px;
  }

  .panel-actions button {
    padding: 3px 10px;
    background: transparent;
    border: 1px solid var(--border-hi);
    border-radius: 4px;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
  }

  .panel-actions button:hover { color: var(--text); border-color: var(--accent); }

  textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    min-height: 420px;
  }

  textarea::placeholder { color: var(--muted); }

  .arrow-col {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
  }

  .arrow-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-hi);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
  }

  .arrow-icon.loading {
    border-color: var(--accent);
    color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .statusbar {
    padding: 8px 32px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 11px;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-msg {
    margin-left: auto;
    font-size: 11px;
  }

  .status-msg.ok { color: var(--green); }
  .status-msg.err { color: var(--red); }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 10px 18px;
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 99;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast.err { border-color: var(--red); color: var(--red); }

  @media (max-width: 960px) {
    .panels {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .arrow-col {
      display: none;
    }

    .status-msg {
      margin-left: 0;
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">CPA-SUB2_<span>CONV</span></div>
    <span class="badge">CPA to Sub2API</span>
    <span class="badge">Sub2API to CPA</span>
    <span class="badge" id="detectBadge" style="display:none"></span>
  </header>

  <main>
    <div class="controls">
      <div class="seg-group">
        <button id="btnAuto" class="active" onclick="setMode('auto')">自动识别</button>
        <button id="btnCpa2Sub" onclick="setMode('cpa2sub')">CPA to Sub2</button>
        <button id="btnSub2Cpa" onclick="setMode('sub2cpa')">Sub2 to CPA</button>
      </div>

      <button class="btn btn-primary" onclick="doConvert()" id="convertBtn">转换文本</button>
      <button class="btn btn-primary" onclick="uploadAndConvert()" id="convertFileBtn">上传并转换文件</button>
      <button class="btn btn-ghost" onclick="swapPanels()">互换</button>

      <span id="statusMsg" class="status-msg"></span>
    </div>

    <div class="upload-bar">
      <input id="fileInput" type="file" accept=".json,.zip,application/json,application/zip" hidden>
      <button class="btn btn-ghost" onclick="pickFile()">选择 JSON / ZIP</button>
      <div id="selectedFile" class="file-chip empty">未选择文件</div>
    </div>

    <div class="naming-bar">
      <span class="hint">下载命名方式：</span>
      <div class="naming-options">
        <div class="naming-card">
          <label><input type="radio" name="namingMode" value="timestamp" checked> 1. 时间戳</label>
        </div>
        <div class="naming-card">
          <label><input type="radio" name="namingMode" value="original"> 2. 格式 + 原文件名</label>
        </div>
        <div class="naming-card">
          <label><input type="radio" name="namingMode" value="jsonName"> 3. 格式 + JSON中的name</label>
        </div>
        <div class="naming-card">
          <label><input type="radio" name="namingMode" value="custom"> 4. 自定义前缀</label>
          <input id="customPrefix" class="naming-input" type="text" placeholder="输入前缀，例如 my_export">
        </div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span class="dot dot-blue"></span>
            <span id="leftTitle">输入（自动识别）</span>
          </div>
          <div class="panel-actions">
            <button onclick="pasteInput()">粘贴</button>
            <button onclick="clearInput()">清空</button>
            <button onclick="detectInput()">识别</button>
          </div>
        </div>
        <textarea id="inputArea" placeholder="粘贴 CPA 或 Sub2API 格式 JSON，或者直接上传 .json / .zip 文件"></textarea>
      </div>

      <div class="arrow-col">
        <div class="arrow-icon" id="arrowIcon">↔</div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span class="dot dot-green"></span>
            <span id="rightTitle">输出</span>
          </div>
          <div class="panel-actions">
            <button onclick="copyOutput()">复制</button>
            <button onclick="downloadOutput()">下载</button>
            <button onclick="clearOutput()">清空</button>
          </div>
        </div>
        <textarea id="outputArea" placeholder="文本转换结果显示在这里；上传 JSON 会按命名规则下载；上传 ZIP 仍下载 converted_时间戳.zip" readonly></textarea>
      </div>
    </div>
  </main>

  <div class="statusbar">
    <span class="status-item">ready</span>
    <span id="charCount" class="status-item">0 chars</span>
    <span id="lineCount" class="status-item">0 lines</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let mode = 'auto';
let selectedFile = null;

function setMode(m) {
  mode = m;
  document.querySelectorAll('.seg-group button').forEach(b => b.classList.remove('active'));
  const map = { auto: 'btnAuto', cpa2sub: 'btnCpa2Sub', sub2cpa: 'btnSub2Cpa' };
  document.getElementById(map[m]).classList.add('active');
  updateTitles();
}

function updateTitles() {
  const titles = {
    auto: ['输入（自动识别）', '输出'],
    cpa2sub: ['CPA 格式输入', 'Sub2API 格式输出'],
    sub2cpa: ['Sub2API 格式输入', 'CPA 格式输出'],
  };
  document.getElementById('leftTitle').textContent = titles[mode][0];
  document.getElementById('rightTitle').textContent = titles[mode][1];
}

function getTarget() {
  return mode === 'cpa2sub' ? 'sub2'
    : mode === 'sub2cpa' ? 'cpa'
    : 'auto';
}

function getNamingMode() {
  return document.querySelector('input[name="namingMode"]:checked')?.value || 'timestamp';
}

function getCustomPrefix() {
  return sanitizeFileNamePart(document.getElementById('customPrefix').value || '');
}

function buildTimestamp() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
}

function detectOutputType(parsed) {
  if (Array.isArray(parsed)) {
    if (parsed[0]?.type === 'codex') return 'cpa';
  }
  if (parsed && typeof parsed === 'object') {
    if (parsed.type === 'codex') return 'cpa';
    if (Array.isArray(parsed.accounts)) return 'sub2';
  }
  return 'unknown';
}

function extractNameFromJSON(parsed) {
  if (Array.isArray(parsed)) {
    const item = parsed[0] || {};
    return item.name || item.email || item.account_id || '';
  }
  if (parsed && typeof parsed === 'object') {
    if (Array.isArray(parsed.accounts)) {
      const account = parsed.accounts[0] || {};
      return account.name || account.credentials?.email || account.extra?.email || '';
    }
    return parsed.name || parsed.email || parsed.account_id || '';
  }
  return '';
}

function getFormatPrefix(format) {
  return format === 'cpa' || format === 'sub2' ? format : 'converted';
}

function getBaseNameFromFile(fileName) {
  return String(fileName || 'converted').replace(/\.[^.]+$/i, '');
}

function buildNamedJSONFileName(jsonText, options = {}) {
  const sourceFileName = options.sourceFileName || '';
  let parsed;

  try {
    parsed = JSON.parse(jsonText);
  } catch (e) {
    return `converted_${buildTimestamp()}.json`;
  }

  const outputFormat = detectOutputType(parsed);
  const formatPrefix = getFormatPrefix(outputFormat);
  const namingMode = getNamingMode();

  if (namingMode === 'timestamp') {
    return `${buildTimestamp()}.json`;
  }

  if (namingMode === 'original') {
    const base = sanitizeFileNamePart(getBaseNameFromFile(sourceFileName || 'pasted_json'));
    return `${formatPrefix}_${base}.json`;
  }

  if (namingMode === 'jsonName') {
    const jsonName = sanitizeFileNamePart(extractNameFromJSON(parsed) || 'unknown');
    return `${formatPrefix}_${jsonName}.json`;
  }

  if (namingMode === 'custom') {
    const prefix = getCustomPrefix();
    if (!prefix) {
      showToast('请先输入自定义前缀', 'err');
      return null;
    }
    return `${prefix}_${formatPrefix}.json`;
  }

  return `converted_${buildTimestamp()}.json`;
}

async function doConvert() {
  const input = document.getElementById('inputArea').value.trim();
  if (!input) {
    showToast('请先输入 JSON 内容', 'err');
    return;
  }

  setLoading(true, 'text');
  clearStatus();

  try {
    const res = await fetch('/api/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input, target: getTarget() }),
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      throw new Error(data.error || '转换失败');
    }
    document.getElementById('outputArea').value = data.output;
    setStatus('文本转换成功', 'ok');
    showToast('文本转换成功', 'ok');
    if (data.detected) showDetected(data.detected);
  } catch (e) {
    setStatus(e.message, 'err');
    showToast(e.message, 'err');
  } finally {
    setLoading(false, 'text');
  }
}

async function detectInput() {
  const input = document.getElementById('inputArea').value.trim();
  if (!input) {
    showToast('没有内容可识别', 'err');
    return;
  }
  try {
    const res = await fetch('/api/detect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input }),
    });
    const data = await res.json();
    showDetected(data.format);
    const label = { cpa: 'CPA', sub2: 'Sub2API', unknown: '未知格式' };
    showToast('识别结果: ' + (label[data.format] || data.format), data.format === 'unknown' ? 'err' : 'ok');
  } catch (e) {
    showToast('识别失败', 'err');
  }
}

function showDetected(fmt) {
  const el = document.getElementById('detectBadge');
  const label = { cpa: 'CPA', sub2: 'Sub2API', unknown: 'UNKNOWN' };
  el.textContent = label[fmt] || fmt;
  el.className = 'badge';
  el.style.display = 'inline-block';
}

function setLoading(on, type) {
  const arrow = document.getElementById('arrowIcon');
  const textBtn = document.getElementById('convertBtn');
  const fileBtn = document.getElementById('convertFileBtn');

  if (on) {
    arrow.classList.add('loading');
    textBtn.disabled = true;
    fileBtn.disabled = true;
    setStatus(type === 'file' ? '文件转换中...' : '文本转换中...', '');
  } else {
    arrow.classList.remove('loading');
    textBtn.disabled = false;
    fileBtn.disabled = false;
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (type || '');
}

function clearStatus() {
  setStatus('', '');
}

function pickFile() {
  document.getElementById('fileInput').click();
}

function updateSelectedFileChip() {
  const chip = document.getElementById('selectedFile');
  if (!selectedFile) {
    chip.textContent = '未选择文件';
    chip.className = 'file-chip empty';
    return;
  }
  chip.textContent = `${selectedFile.name} (${formatBytes(selectedFile.size)})`;
  chip.className = 'file-chip';
}

async function uploadAndConvert() {
  if (!selectedFile) {
    showToast('请先选择 .json 或 .zip 文件', 'err');
    return;
  }

  const form = new FormData();
  form.append('file', selectedFile);
  form.append('target', getTarget());

  setLoading(true, 'file');
  clearStatus();

  try {
    const res = await fetch('/api/convert-file', {
      method: 'POST',
      body: form,
    });

    if (!res.ok) {
      let msg = '文件转换失败';
      try {
        const data = await res.json();
        msg = data.error || msg;
      } catch (e) {}
      throw new Error(msg);
    }

    const blob = await res.blob();
    let fileName;

    if (selectedFile.name.toLowerCase().endsWith('.zip')) {
      const disposition = res.headers.get('Content-Disposition') || '';
      fileName = parseDownloadName(disposition, selectedFile.name);
    } else {
      const text = await blob.text();
      fileName = buildNamedJSONFileName(text, { sourceFileName: selectedFile.name });
      if (!fileName) return;
      document.getElementById('outputArea').value = text;
      triggerDownload(new Blob([text], { type: 'application/json' }), fileName);
      setStatus('JSON 文件转换成功', 'ok');
      showToast('JSON 文件转换成功，已开始下载', 'ok');
      return;
    }

    triggerDownload(blob, fileName);
    setStatus('压缩包转换成功', 'ok');
    showToast('压缩包转换成功，已开始下载', 'ok');
  } catch (e) {
    setStatus(e.message, 'err');
    showToast(e.message, 'err');
  } finally {
    setLoading(false, 'file');
  }
}

function parseDownloadName(disposition, fallback) {
  const match = disposition.match(/filename="?([^"]+)"?/i);
  if (match && match[1]) return match[1];
  if ((selectedFile?.name || '').toLowerCase().endsWith('.zip')) return fallback.replace(/\.zip$/i, '') + '_converted.zip';
  return fallback.replace(/\.json$/i, '') + '_converted.json';
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function swapPanels() {
  const inp = document.getElementById('inputArea');
  const out = document.getElementById('outputArea');
  const tmp = inp.value;
  inp.value = out.value;
  out.value = tmp;
  updateCounters();
  showToast('已互换', 'ok');
}

async function pasteInput() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputArea').value = text;
    updateCounters();
  } catch (e) {
    showToast('无法访问剪贴板', 'err');
  }
}

function clearInput() {
  document.getElementById('inputArea').value = '';
  updateCounters();
  document.getElementById('detectBadge').style.display = 'none';
}

function clearOutput() {
  document.getElementById('outputArea').value = '';
}

async function copyOutput() {
  const val = document.getElementById('outputArea').value;
  if (!val) {
    showToast('输出为空', 'err');
    return;
  }
  try {
    await navigator.clipboard.writeText(val);
    showToast('已复制到剪贴板', 'ok');
  } catch (e) {
    showToast('复制失败', 'err');
  }
}

function downloadOutput() {
  const val = document.getElementById('outputArea').value;
  if (!val) {
    showToast('输出为空', 'err');
    return;
  }

  const fileName = buildNamedJSONFileName(val, {
    sourceFileName: selectedFile?.name || 'pasted_json.json',
  });
  if (!fileName) return;

  triggerDownload(new Blob([val], { type: 'application/json' }), fileName);
  showToast('下载: ' + fileName, 'ok');
}

function sanitizeFileNamePart(value) {
  return String(value || 'unknown')
    .trim()
    .replace(/[\\/:*?"<>|]/g, '_')
    .replace(/\s+/g, '_');
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function updateCounters() {
  const v = document.getElementById('inputArea').value;
  document.getElementById('charCount').textContent = v.length + ' chars';
  document.getElementById('lineCount').textContent = (v ? v.split('\n').length : 0) + ' lines';
}

document.getElementById('inputArea').addEventListener('input', updateCounters);
document.getElementById('fileInput').addEventListener('change', e => {
  selectedFile = e.target.files[0] || null;
  updateSelectedFileChip();
});

document.getElementById('customPrefix').addEventListener('focus', () => {
  const customRadio = document.querySelector('input[name="namingMode"][value="custom"]');
  if (customRadio) customRadio.checked = true;
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doConvert();
});

let toastTimer;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2400);
}

updateTitles();
updateCounters();
updateSelectedFileChip();
</script>
</body>
</html>
